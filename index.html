<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>민술랭</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;700&display=swap">
<style>
/* Layout: 지도가 화면 전체, 그 위에 왼쪽 떠 있는 패널(지역 → 예약 조건 → 목록). 폰은 패널이 화면 전체, 지도는 버튼으로 열기. 어두운 웜톤 한 가지 테마로 고정. */
:root{
  --bg:#1b1815; --panel:#24201c; --surface:#2e2924; --surface-2:#38322c; --ink:#f1ece4; --muted:#ada293; --line:#433c35;
  --accent:#f0a54a; --accent-2:#f6bd6a; --accent-ink:#231a0f;
  --seal:#f2765c; --seal-bg:#3b2620; --star:#f0a54a;
  --ok:#8fd19e; --ok-bg:#24372a; --blue:#8fb4ff; --blue-bg:#25304a;
  --shadow:0 12px 32px rgba(8,6,4,.5); --shadow-sm:0 4px 14px rgba(8,6,4,.5);
  --display:"Do Hyeon","Pretendard Variable",Pretendard,"Apple SD Gothic Neo",sans-serif;
  --body:"Pretendard Variable",Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --stamp:"Do Hyeon","Apple SD Gothic Neo",sans-serif;
  --r:10px; --rp:16px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}

/* 지도 + 떠 있는 패널 */
.app{position:relative;height:100%}
.mapside{position:fixed;inset:0;z-index:0}
#map{position:absolute!important;inset:0;width:100%!important;height:100%!important;background:#1f1c19}
#map svg{width:100%;height:100%;display:block}
#map img[src*="pstatic.net"]{filter:invert(1) hue-rotate(185deg) brightness(.82) contrast(.92) saturate(.6)}
.mapnote{position:absolute;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:12px;color:var(--muted);box-shadow:var(--shadow-sm);max-width:calc(100% - 32px)}
.panel{position:fixed;z-index:10;left:max(16px,env(safe-area-inset-left,0px));top:calc(16px + env(safe-area-inset-top,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:440px;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--rp);box-shadow:var(--shadow);overflow-y:auto;padding:0 18px 24px;display:flex;flex-direction:column;gap:16px;transition:transform .25s cubic-bezier(.16,1,.3,1),opacity .2s}
body.collapsed .panel{transform:translateX(calc(-100% - 24px));opacity:0}
.collapse{position:fixed;z-index:11;top:50%;left:calc(max(16px,env(safe-area-inset-left,0px)) + 440px - 1px);transform:translateY(-50%);width:22px;height:52px;border:1px solid var(--line);border-left:none;border-radius:0 10px 10px 0;background:var(--panel);color:var(--muted);display:grid;place-items:center;transition:left .25s cubic-bezier(.16,1,.3,1)}
body.collapsed .collapse{left:0;border-left:1px solid var(--line)}
body.collapsed .collapse span{transform:rotate(180deg)}
.floatadd{position:fixed;z-index:10;top:calc(16px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px))}

/* 헤더 */
.top{position:sticky;top:0;z-index:5;background:var(--panel);padding-top:20px;padding-bottom:4px;display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.brand{min-width:0}
.logo{font-family:var(--display);font-weight:400;font-size:32px;line-height:1;margin:0;display:flex;align-items:baseline;gap:2px;letter-spacing:-.01em}
.logo .key{display:inline}
.logo .spark{display:none}
.logo .stars3{color:var(--accent);font-size:15px;letter-spacing:-1px;margin-left:6px;transform:translateY(-12px)}
.tag{margin:6px 0 0;color:var(--muted);font-size:13px}
.tag mark{background:none;color:var(--seal);font-weight:700}
.topbtns{display:flex;gap:8px;align-items:center;padding-top:6px}
.who{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.addbtn{border:none;background:var(--accent);color:var(--accent-ink);border-radius:999px;height:44px;padding:0 22px;font-weight:700;font-size:14px;box-shadow:var(--shadow-sm);white-space:nowrap;transition:background .11s}
.addbtn:hover{background:var(--accent-2)}
.top .addbtn{display:none}
.linkbtn{border:none;background:none;color:var(--accent);padding:0;text-decoration:underline;text-underline-offset:2px;font-size:13px}

/* 섹션 라벨 */
.qlab,.fgroup > .qlab{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.02em}

/* 지역 */
.scope{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px}
.scope button{border:none;background:none;border-radius:9px;padding:9px 8px;font-family:var(--display);font-size:17px;color:var(--muted);transition:background .11s,color .11s}
.scope button small{display:block;font-family:var(--body);font-size:11px;opacity:.8}
.scope button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
.rows{display:flex;flex-direction:column;gap:8px}
.chiprow{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chiprow::-webkit-scrollbar{display:none}
.chiprow.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;font-size:13px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap;color:var(--ink);transition:border-color .11s,background .11s}
.chip:hover{border-color:var(--muted)}
.chip .n{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{border-color:var(--accent);background:rgba(240,165,74,.14);color:var(--accent-2)}
.chip[aria-pressed="true"] .n{color:var(--accent-2)}
.chip.sido{font-weight:700}
.chiprow select{flex:none;border-radius:999px;padding:5px 10px;font-size:13px;background:var(--panel);color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}

/* 예약 조건 */
.booking{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px}
.booking h2{margin:0;font-family:var(--display);font-weight:400;font-size:19px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.booking h2 small{font-family:var(--body);font-size:12px;color:var(--muted)}
.qrow{display:grid;gap:6px}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 11px;font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.minis{display:flex;gap:6px;flex-wrap:wrap}
.mini{border:1px dashed var(--line);background:none;border-radius:8px;padding:5px 10px;font-size:13px;color:var(--muted)}
.mini[aria-pressed="true"]{border:1px solid var(--accent);color:var(--accent-2);background:rgba(240,165,74,.12)}

.fgroup{display:flex;flex-direction:column;gap:8px}
.search{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:0 12px;height:44px}
.search:focus-within{border-color:var(--accent)}
.search input{border:none;background:none;outline:none;flex:1;min-width:0}
.search input::placeholder,.tin::placeholder,textarea::placeholder{color:#7d7366}

.listhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px}
.count{font-size:13px;color:var(--muted)}
.count em{font-style:normal;color:var(--ink);font-weight:700}
select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 8px;font-size:13px}

/* 카드 */
.list{display:flex;flex-direction:column;gap:8px}
.card{position:relative;background:var(--surface);border:1px solid transparent;border-radius:var(--r);padding:12px 16px;text-align:left;width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;transition:border-color .11s,background .11s}
.card:hover{background:#342e28}
.card.sel{border-color:var(--accent)}
.card h3{margin:0;font-family:var(--display);font-weight:400;font-size:19px;line-height:1.3;overflow-wrap:anywhere;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.stars{color:var(--star);font-size:12px;letter-spacing:-1px;white-space:nowrap}
.meta{color:var(--muted);font-size:13px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;overflow-wrap:anywhere}
.cat{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;border-radius:6px;padding:1px 8px;background:color-mix(in srgb,var(--c,#888) 22%,transparent);color:color-mix(in srgb,var(--c,#ccc) 70%,white)}
.cat .dot{display:none}
.caps{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.cap{font-size:12px;border-radius:6px;padding:2px 8px;background:var(--surface-2);color:var(--ink);font-variant-numeric:tabular-nums}
.cap.room{background:var(--ok-bg);color:var(--ok);font-weight:700}
.cap.group{background:var(--blue-bg);color:var(--blue);font-weight:700}
.cap.nbook{background:#03c75a;color:#fff;font-weight:700}
.cap.unk{background:none;border:1px dashed var(--line);color:var(--muted)}
.quote{grid-column:1/-1;margin:8px 0 0;font-size:14px;color:#d9d1c4;overflow-wrap:anywhere;line-height:1.6}
.quote b{display:none}
.empty{background:var(--surface);border-radius:var(--r);padding:28px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty b{font-family:var(--display);font-weight:400;font-size:19px;color:var(--ink)}
.empty .addbtn{display:inline-block}

/* 도장 */
.sealbox{display:flex;align-items:flex-start;gap:4px}
.seal{min-width:44px;flex:none;border:2px solid var(--seal);border-radius:4px;color:var(--seal);background:var(--seal-bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3px 5px;font-family:var(--stamp);font-size:12px;line-height:1.15;transform:rotate(-6deg);text-align:center}
.seal span{display:block}
.seal .bo{font-size:10px;letter-spacing:.2em;margin-right:-.2em}
.seal.more{min-width:0;border:none;background:none;transform:none;color:var(--muted);font-family:var(--body);font-size:12px;padding-top:6px}
.seal.big{min-width:60px;font-size:16px;padding:6px 8px;border-width:2.5px}
.seal.big .bo{font-size:12px}
.seal.stampin{animation:stamp .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes stamp{0%{transform:scale(2.2) rotate(-20deg);opacity:0}60%{opacity:1}100%{transform:rotate(-6deg) scale(1)}}

/* 시트 */
.scrim{position:fixed;inset:0;background:rgba(10,8,6,.55);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:var(--panel);border:1px solid var(--line);width:min(620px,100%);max-height:calc(100dvh - 32px);overflow:auto;border-radius:var(--rp);box-shadow:var(--shadow);
  padding:20px;display:flex;flex-direction:column;gap:14px;animation:up .2s cubic-bezier(.16,1,.3,1)}
@keyframes up{from{transform:translateY(12px);opacity:.5}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet,.seal.stampin,.panel,.collapse{animation:none;transition:none}}
.shead{display:flex;gap:12px;align-items:flex-start}
.shead h2{margin:0;font-family:var(--display);font-weight:400;font-size:26px;line-height:1.2;overflow-wrap:anywhere;text-wrap:balance}
.close{margin-left:auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;width:36px;height:36px;font-size:16px;flex:none;color:var(--muted)}
.box{background:var(--surface);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.box h3{margin:0;font-family:var(--display);font-weight:400;font-size:18px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.box h3 small{font-family:var(--body);font-size:12px;color:var(--muted)}
.box h3 .linkbtn{margin-left:auto}
.callrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tel{font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums;user-select:all}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px;font-size:13px;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.nbtn{display:inline-flex;align-items:center;gap:8px;background:#03c75a;color:#fff;text-decoration:none;border-radius:999px;padding:0 18px;height:42px;font-weight:700;font-size:14px}
.nbtn .n{background:#fff;color:#03c75a;border-radius:4px;width:18px;height:18px;display:grid;place-items:center;font-size:12px;font-weight:900}
.nghost{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);color:var(--ink);background:var(--panel);text-decoration:none;border-radius:999px;padding:0 16px;height:42px;font-size:13px}
.tip{background:rgba(240,165,74,.12);border:1px solid rgba(240,165,74,.4);color:var(--accent-2);border-radius:10px;padding:8px 12px;font-size:14px;overflow-wrap:anywhere}
.tip b{font-weight:700;margin-right:4px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.fact{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0;overflow-wrap:anywhere}
.fact small{display:block;color:var(--muted);font-size:12px}
.fact b{font-family:var(--display);font-weight:400;font-size:18px}
.fact.yes{border-color:rgba(143,209,158,.45);background:var(--ok-bg)}
.fact.yes b{color:var(--ok)}
.fact.unk b{color:var(--muted);font-family:var(--body);font-size:13px}
.stamps{display:flex;flex-direction:column;gap:12px}
.st{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center}
.st p{margin:0;overflow-wrap:anywhere}
.st .d{font-size:12px;color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin:0}
.addr{font-size:13px;color:var(--muted);overflow-wrap:anywhere}

/* 폼 */
form{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0;position:relative}
.field > label,.field > .lab{font-size:13px;font-weight:700}
.field .sub{font-size:12px;color:var(--muted)}
.tin,textarea,.field select{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--bg);font-size:15px}
.tin:focus,textarea:focus,.field select:focus{border-color:var(--accent);outline:none}
textarea{min-height:80px;resize:vertical}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.numrow{display:flex;align-items:center;gap:6px;color:var(--muted)}
.numrow input{width:96px}
.sugg{position:absolute;left:0;right:0;top:calc(100% - 22px);z-index:3;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);max-height:300px;overflow:auto}
.sugg button{display:block;width:100%;text-align:left;border:none;background:none;padding:9px 12px;border-bottom:1px solid var(--line)}
.sugg button:last-child{border-bottom:none}
.sugg button:hover,.sugg button:focus{background:var(--surface-2)}
.sugg small{display:block;color:var(--muted);font-size:12px}
.picked{background:var(--ok-bg);color:var(--ok);border-radius:8px;padding:6px 10px;font-size:13px}
.warn{background:var(--seal-bg);color:var(--seal);border:1px solid rgba(242,118,92,.4);border-radius:8px;padding:8px 12px;font-size:13px}
.submit{align-self:flex-start;border:none;background:var(--accent);color:var(--accent-ink);border-radius:999px;height:44px;padding:0 24px;font-weight:700;font-size:14px}
.submit:hover{background:var(--accent-2)}
.submit.blue{background:var(--accent);color:var(--accent-ink)}
.submit:disabled{opacity:.5;cursor:default}
.formbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
fieldset{border:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
legend{font-family:var(--display);font-size:17px;padding:0;margin-bottom:6px}
details summary{color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:999px;padding:10px 18px;z-index:60;font-size:14px;font-weight:700;max-width:calc(100% - 32px);box-shadow:var(--shadow-sm)}
.fabs{display:none}

@media (max-width:979px){
  .panel{position:static;width:auto;border:none;border-radius:0;box-shadow:none;min-height:100%;overflow:visible;
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:110px}
  .top{padding-top:calc(16px + env(safe-area-inset-top,0px))}
  .collapse,.floatadd{display:none}
  .mapside{z-index:20}
  .mapside:not(.open){display:none}
  .fabs{display:flex;position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;gap:8px}
  .fab{border:1px solid var(--line);border-radius:999px;height:46px;padding:0 20px;font-weight:700;font-size:14px;box-shadow:var(--shadow-sm);background:var(--panel);color:var(--ink)}
  .fab.add{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .scrim{align-items:flex-end;padding:0}
  .sheet{border-radius:var(--rp) var(--rp) 0 0;max-height:92dvh;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
  .toast{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
}
</style>
</head>
<body>

<div class="app">
  <aside class="panel" id="panel">
    <header class="top">
      <div class="brand">
        <div>
          <h1 class="logo">민술랭<span class="stars3" aria-hidden="true">★★★</span></h1>
          <p class="tag">당직자가 직접 도장 찍은 맛집 · 막내들의 예약 지도</p>
        </div>
      </div>
      <div class="topbtns">
        <span class="who" id="who"></span>
        <button class="addbtn" data-add>+ 맛집 추가</button>
      </div>
    </header>

    <div class="scope" role="group" aria-label="지역 보기">
      <button data-scope="ydp" aria-pressed="true">영등포구<small>동별로 보기</small></button>
      <button data-scope="region" aria-pressed="false">지역별<small>전국 시·군·구별</small></button>
    </div>
    <div class="rows" id="areaRows"></div>

    <section class="booking" aria-labelledby="bkTitle">
      <h2 id="bkTitle">예약 조건 <small>룸이랑 인원부터 골라 보세요</small></h2>
      <div class="qrow"><span class="qlab">몇 명이에요?</span><div class="seg" id="peopleSeg"></div></div>
      <div class="qrow"><span class="qlab">룸</span><div class="seg" id="roomSeg"></div></div>
      <div class="minis" id="miniRow"></div>
    </section>

    <div class="fgroup"><span class="qlab">음식</span><div class="chiprow" id="catRow"></div></div>
    <div class="fgroup" id="stamperGroup" hidden><span class="qlab">보증인</span><div class="chiprow" id="stamperRow"></div></div>
    <label class="search"><span aria-hidden="true" style="color:var(--muted)">⌕</span><input id="q" type="search" placeholder="가게 이름, 동네, 한줄평 검색" autocomplete="off"></label>

    <div class="listhead">
      <div class="count" id="count"></div>
      <select id="sort" aria-label="정렬"><option value="stamps">보증 많은 순</option><option value="cap">큰 인원 순</option><option value="recent">최근 추가 순</option><option value="name">가나다 순</option></select>
    </div>
    <div class="list" id="list"></div>
  </aside>
  <button class="collapse" id="collapse" aria-label="목록 접기"><span aria-hidden="true">‹</span></button>
  <button class="addbtn floatadd" data-add>+ 맛집 추가</button>
  <main class="mapside" id="mapside">
    <div id="map" role="region" aria-label="지도"></div>
    <div class="mapnote" id="mapnote" hidden></div>

/* 사람별 문서 minsul/<uid> = {name, places:{pid:{...}}, stamps:{pid:{note,at}}, info:{pid:{field:value,...,at}}} */
let DOCS = {}, ME = "local-me", MODE = "local", CAN_WRITE = true, BACKEND = null, DEFAULT_NAME = "";
let PLACES = [], BY_ID = {};
const emptyDoc = ()=>({name:"",places:{},stamps:{},info:{}});
const myDoc = ()=> DOCS[ME] || (DOCS[ME]=emptyDoc());
const myName = ()=> (DOCS[ME]&&DOCS[ME].name) || DEFAULT_NAME || "";

function rebuild(){
  const list=[];
  for(const [uid,doc] of Object.entries(DOCS)){
    for(const [pid,p] of Object.entries((doc&&doc.places)||{})){
      if(!p||!p.name) continue;
      list.push({...p, id:pid, by:uid, stamps:[], info:{}, infoAt:{}});
    }
  }
  BY_ID = Object.fromEntries(list.map(p=>[p.id,p]));
  for(const [uid,doc] of Object.entries(DOCS)){
    for(const [pid,s] of Object.entries((doc&&doc.stamps)||{})){ const p=BY_ID[pid]; if(p&&s) p.stamps.push({uid,name:(doc.name||"당직자"),note:s.note||"",at:s.at||0}); }
    for(const [pid,inf] of Object.entries((doc&&doc.info)||{})){
      const p=BY_ID[pid]; if(!p||!inf) continue; const at=inf.at||0;
      for(const k of INFO_FIELDS){ if(!(k in inf)) continue; if(!(k in p.infoAt) || at>=p.infoAt[k]){ p.info[k]=inf[k]; p.infoAt[k]=at; } }
    }
  }
  for(const p of list){
    p.stamps.sort((a,b)=>(a.uid===p.by?-1:b.uid===p.by?1:a.at-b.at));
    for(const k of Object.keys(p.info)) if(p.info[k]===""||p.info[k]==null) delete p.info[k];
    p.lastInfo = Math.max(0,...Object.values(p.infoAt));
  }
  PLACES = list.filter(p=>p.stamps.length);
}

const $ = s=>document.querySelector(s);

function fmtTel(t){ t=String(t||"").replace(/\D/g,""); if(!t) return "";
  if(t.startsWith("02")) return t.length===9?t.replace(/(02)(\d{3})(\d{4})/,"$1-$2-$3"):t.replace(/(02)(\d{4})(\d{4})/,"$1-$2-$3");
  if(t.length===11) return t.replace(/(\d{3})(\d{4})(\d{4})/,"$1-$2-$3"); if(t.length===10) return t.replace(/(\d{3})(\d{3})(\d{4})/,"$1-$2-$3"); if(t.length===8) return t.replace(/(\d{4})(\d{4})/,"$1-$2"); return t; }
function safeNaverUrl(u){ try{ const x=new URL(String(u||"").trim()); if(x.protocol!=="https:") return ""; if(!/(^|\.)naver\.(com|me)$/.test(x.hostname)) return ""; return x.href; }catch(e){ return ""; } }
function areaName(p){
  if(p.scope==="ydp"){ const a=YDP_AREAS.find(a=>a.id===p.area); return a?a.name:"영등포구"; }
  const s=SIDO.find(s=>s.id===p.sido); return (s?s.name+" ":"")+(p.dong||"");
}
function sealHTML(name,cls=""){
  const n=String(name||"당직자").slice(0,4);

}
function cap(p){ const i=p.info; return Math.max(i.group===false?0:(+i.groupMax||0), i.room===true?(+i.roomMax||0):0); }
function capFor(p){ return (S.room==="any") ? cap(p) : (+p.info.roomMax||0); }

/* ───── 필터 ───── */
/* 지역별 보기: 서울 > 영등포구에는 영등포구 탭의 맛집도 함께 보여요 */
function inRegionDong(p,sid,d){
  if(p.scope==="region") return p.sido===sid && (d==="all"||p.dong===d);
  return sid==="seoul" && (d==="all"||d==="영등포구");
}
function inScope(p){
  if(S.scope==="ydp"){ if(p.scope!=="ydp") return false; return S.area==="all"||p.area===S.area; }
  return inRegionDong(p,S.sido,S.dong);
}
function passBooking(p){
  const i=p.info;
  if(S.room==="room" && i.room!==true) return false;
  if(S.room==="private" && !(i.room===true && i.roomType==="독립룸")) return false;
  if(S.people && capFor(p) < S.people) return false;
  if(S.minis.has("nbook") && !safeNaverUrl(i.bookingUrl)) return false;
  for(const k of ["rental","parking","corkage"]) if(S.minis.has(k) && i[k]!==true) return false;
  return true;
}
function filtered(){
  const q=S.q.trim().toLowerCase();
  const arr=PLACES.filter(p=>inScope(p) && passBooking(p)
    && (!S.cat||p.cat===S.cat)
    && (!S.stamper||p.stamps.some(s=>s.name===S.stamper))
    && (!q || (p.name+" "+(p.addr||"")+" "+areaName(p)+" "+p.stamps.map(s=>s.note+" "+s.name).join(" ")).toLowerCase().includes(q)));
  const cmp={
    stamps:(a,b)=>(b.stamps.length-a.stamps.length)||(b.at-a.at),
    cap:(a,b)=>(capFor(b)-capFor(a))||(b.stamps.length-a.stamps.length),
    recent:(a,b)=>(b.at||0)-(a.at||0),
    name:(a,b)=>a.name.localeCompare(b.name,"ko")
  }[S.sort];
  return arr.sort(cmp);
}

function capsHTML(p){
  const i=p.info, t=[];
  if(i.room===true){ const bits=[i.roomType==="독립룸"?"독립룸":"룸", i.roomCount?`${i.roomCount}개`:"", i.roomMax?`최대 ${i.roomMax}명`:""].filter(Boolean); t.push(`<span class="cap room">${esc(bits.join(" · "))}</span>`); }
  else if(i.room===false) t.push(`<span class="cap">룸 없음</span>`);
  if(i.groupMax && i.group!==false) t.push(`<span class="cap group">단체 ${i.groupMax}명까지</span>`);
  if(i.rental===true) t.push(`<span class="cap group">통대관</span>`);

/* ───── 지도 ───── */
let NMAP=null, nMarkers=[], nKey="", nFit="", pickMode=false, pickCb=null;
function mapTarget(){
  if(S.scope==="ydp"){ if(S.area!=="all") return {c:AREA_C[S.area], z:16}; return {c:[37.5180,126.9080], z:14}; }
  const s=SIDO.find(s=>s.id===S.sido); return {c:s.c, z:s.z};
}
function renderMap(items){
  if(NMAP) return renderNaver(items);
  const withC=items.filter(p=>p.lat&&p.lng);
  const W=600,H=520,pad=50;
  let pts=withC, t=mapTarget();
  const lat0=t.c[0], k=Math.cos(lat0*Math.PI/180);
  let span = t.z>=16?0.006:t.z>=14?0.04:t.z>=11?0.25:t.z>=10?0.6:2.2;
  if(pts.length>1){ const la=pts.map(p=>p.lat), ln=pts.map(p=>p.lng*k); span=Math.max(span*0.25, Math.max(...la)-Math.min(...la), Math.max(...ln)-Math.min(...ln)); }
  const cy = pts.length? (Math.max(...pts.map(p=>p.lat))+Math.min(...pts.map(p=>p.lat)))/2 : t.c[0];
  const cx = pts.length? (Math.max(...pts.map(p=>p.lng*k))+Math.min(...pts.map(p=>p.lng*k)))/2 : t.c[1]*k;
  const sc=Math.min(W-2*pad,H-2*pad)/span;
  const P=(la,ln)=>[(ln*k-cx)*sc+W/2,(cy-la)*sc+H/2];
  let g=""; for(let x=0;x<W;x+=40) g+=`<line x1="${x}" y1="0" x2="${x}" y2="${H}" stroke="var(--line)" stroke-dasharray="2 6"/>`; for(let y=0;y<H;y+=40) g+=`<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="var(--line)" stroke-dasharray="2 6"/>`;
  const pins = [...pts].sort((a,b)=>(a.id===S.sel)-(b.id===S.sel)).map(p=>{ const [x,y]=P(p.lat,p.lng), sel=p.id===S.sel;
    return `<g class="pin" data-p="${esc(p.id)}" role="button" tabindex="0" aria-label="${esc(p.name)}" transform="translate(${x.toFixed(1)},${y.toFixed(1)}) scale(${sel?1.3:1})" style="cursor:pointer">
      <circle r="13" fill="${sel?"var(--accent)":"var(--panel)"}" stroke="var(--accent)" stroke-width="2"/><text y="4.5" text-anchor="middle" font-family="Do Hyeon,sans-serif" font-size="13" fill="${sel?"var(--accent-ink)":"var(--accent)"}">${p.stamps.length}</text>
      <text y="-19" text-anchor="middle" font-family="Do Hyeon,sans-serif" font-size="12" fill="var(--ink)" stroke="var(--bg)" stroke-width="3.5" paint-order="stroke">${esc(p.name.length>10?p.name.slice(0,10)+"…":p.name)}</text></g>`; }).join("");
  const msg = !items.length ? "표시할 맛집이 없어요" : (!withC.length ? "위치가 등록된 맛집이 없어요" : "");
  $("#map").innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${g}${pins}${msg?`<text x="${W/2}" y="${H/2}" text-anchor="middle" font-family="Do Hyeon,sans-serif" font-size="18" fill="var(--muted)">${msg}</text>`:""}</svg>`;
  const note=$("#mapnote"); note.hidden=false; note.textContent="간단 지도예요. 사이트에 올리면 네이버 지도로 보여요.";
}
function renderNaver(items){
  const withC=items.filter(p=>p.lat&&p.lng);
  const key=withC.map(p=>p.id+":"+p.stamps.length).join(",")+"|"+S.sel;
  if(key!==nKey){
    nKey=key; nMarkers.forEach(m=>m.setMap(null)); nMarkers=[];
    for(const p of withC){
      const sel=p.id===S.sel, n=p.stamps.length;
      const html=`<div style="transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;font-family:'Do Hyeon',sans-serif">

function loadNaver(){

function geocode(addr){
  return new Promise(res=>{
    if(!(window.naver&&naver.maps&&naver.maps.Service&&naver.maps.Service.geocode)) return res(null);

  if(!hits.length){ box.hidden=true; return; }
  box.innerHTML=hits.map((r,ix)=>`<button type="button" data-sugg="${YDP_DB.indexOf(r)}"><b>${esc(r[0])}</b><small>${esc(YDP_AREAS.find(a=>a.id===r[2]).name)} · ${esc(r[5])}${r[1]?` · ${esc(r[1])}`:""}</small></button>`).join("");

  const n=norm($("#a-name")?.value||ADD.name); if(!n){ w.innerHTML=""; return; }
  const d=PLACES.find(p=>norm(p.name)===n && (ADD.scope==="ydp"?p.scope==="ydp":p.sido===ADD.sido));
  w.innerHTML = d ? `<div class="warn">이미 ${esc(d.stamps.map(s=>s.name).join(", "))} 님이 보증한 가게예요. <button class="linkbtn" type="button" data-gotoplace="${esc(d.id)}">거기에 내 도장 더하기</button></div>` : "";
}

/* ───── 저장 ───── */
const canWrite = ()=> MODE!=="none" && CAN_WRITE!==false;
function writeHint(){ return MODE==="none" ? (BACKEND==="firebase" ? `도장을 찍으려면 로그인해 주세요. <button class="linkbtn" data-login>구글 계정으로 로그인</button>` : "로그인하면 맛집을 추가하고 도장을 찍을 수 있어요.") : "도장을 찍으려면 이 페이지를 공유해 준 분에게 작성 권한(Contributor)을 요청하세요."; }
async function saveMine(){
  const doc=JSON.parse(JSON.stringify(myDoc()));
  try{
    if(MODE==="claude"){ await BACKEND_DB.doc(COLL+"/"+ME).set(doc); }
    else if(MODE==="firebase"){ await BACKEND_DB.collection(COLL).doc(ME).set(doc); }
    else { localStorage.setItem("minsul.mine", JSON.stringify(doc)); }
    return true;
  }catch(e){
    const denied = e && (e.code==="invalid_argument"||e.code==="permission-denied");
    if(denied){ CAN_WRITE=false; toast("작성 권한이 없어요."); } else toast("저장하지 못했어요. 잠시 뒤 다시 눌러 주세요.");
    return false;
  }
}
async function mutate(fn,msg){
  const before=JSON.stringify(myDoc()); fn(myDoc()); rebuild();
  const ok=await saveMine();
  if(!ok){ DOCS[ME]=JSON.parse(before); rebuild(); } else if(msg) toast(msg);
  render(); return ok;
}
function toast(m){ const t=$("#toast"); t.textContent=m; t.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>t.hidden=true,2400); }
function newId(){ return "p"+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

/* ───── 이벤트 ───── */
document.addEventListener("click", async e=>{
  const t=e.target, c=sel=>t.closest(sel);
  let b;
  if(b=c("[data-scope]")){ S.scope=b.dataset.scope; S.stamper=""; savePrefs(); render(); return; }
  if(b=c("[data-area]")){ S.area=b.dataset.area; savePrefs(); render(); return; }
  if(b=c("[data-sido]")){ S.sido=b.dataset.sido; S.dong="all"; savePrefs(); render(); return; }
  if(b=c("[data-dong]")){ S.dong=b.dataset.dong; render(); return; }
  if(b=c("[data-people]")){ S.people=+b.dataset.people; render(); return; }
  if(b=c("[data-room]")){ S.room=b.dataset.room; render(); return; }
  if(b=c("[data-mini]")){ const k=b.dataset.mini; S.minis.has(k)?S.minis.delete(k):S.minis.add(k); render(); return; }
  if(b=c("[data-cat]")){ S.cat=b.dataset.cat; render(); return; }
  if(b=c("[data-stamper]")){ S.stamper=b.dataset.stamper; render(); return; }
  if(c("#mapFab")){ S.mapOpen=!S.mapOpen; $("#mapside").classList.toggle("open",S.mapOpen); $("#mapFab").textContent=S.mapOpen?"목록":"지도"; if(NMAP) setTimeout(()=>{ fitMapSize(); nFit=""; render(); },50); return; }
  if(c("#collapse")){ const on=document.body.classList.toggle("collapsed"); $("#collapse").setAttribute("aria-label", on?"목록 펼치기":"목록 접기"); return; }
  if(c("[data-add]")){ openAdd(); return; }
  if(b=c(".card[data-p], .pin[data-p]")){ openPlace(b.dataset.p); return; }
  if(t===$("#scrim")||c(".close")||c("[data-closeadd]")){ ADD=null; closeSheet(); return; }
  if(c("[data-back]")){ renderPlace(); return; }
  if(c("[data-editinfo]")){ S.view="info"; renderInfoForm(); return; }
  if(c("[data-stampform]")){ S.view="stamp"; renderStampForm(); return; }
  if(b=c("[data-copy]")){ try{ await navigator.clipboard.writeText(b.dataset.copy); toast("번호를 복사했어요"); }catch(err){ const r=document.createRange(); r.selectNodeContents($("#telText")); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast("번호를 선택했어요. 복사해서 쓰세요"); } return; }
  if(c("[data-unstamp]")){
    const p=BY_ID[S.sel]; const delPlace = p.by===ME;
    if(delPlace && p.stamps.length>1){ toast("다른 분 도장이 있어서 내 도장만 뺐어요"); }
    const removeAll = delPlace && p.stamps.length===1;
    const ok=await mutate(d=>{ delete d.stamps[p.id]; if(removeAll){ delete d.places[p.id]; delete d.info[p.id]; } }, removeAll?"맛집을 지웠어요":"보증을 취소했어요");
    if(ok){ if(removeAll||!BY_ID[p.id]||!BY_ID[p.id].stamps.length) closeSheet(); else renderPlace(); }
    return;
  }
  if(b=c("[data-gotoplace]")){ ADD=null; S.sel=b.dataset.gotoplace; S.view="stamp"; renderStampForm(); return; }
  if(b=c("[data-ascope]")){ keepAddInputs(); ADD.scope=b.dataset.ascope; ADD.src=null; renderAdd(); return; }
  if(b=c("[data-sugg]")){ const r=YDP_DB[+b.dataset.sugg]; keepAddInputs();
    Object.assign(ADD,{name:r[0], cat:r[1]||ADD.cat, area:r[2], lat:r[3], lng:r[4], addr:r[5], tel:r[6], src:"gov"}); if(ADD.info) ADD.info.tel=fmtTel(r[6])||ADD.info.tel; renderAdd(); $("#a-sname")?.focus(); return; }
  if(c("[data-geocode]")){ keepAddInputs(); const q=(ADD.scope==="ydp"?"서울 영등포구 ":"")+ADD.addr; if(!ADD.addr.trim()){ toast("주소를 먼저 넣어 주세요"); return; }
    const r=await geocode(q); if(r){ ADD.lat=r.lat; ADD.lng=r.lng; if(r.addr) ADD.addr=r.addr.replace(/^서울특별시 영등포구 /,""); renderAdd(); toast("위치를 찾았어요"); } else toast("주소로 위치를 못 찾았어요. 지도에서 직접 찍어 주세요."); return; }
  if(c("[data-pick]")){ keepAddInputs(); const saved=$("#scrim").innerHTML; $("#scrim").hidden=true; document.body.style.overflow="";
    if(window.innerWidth<980){ S.mapOpen=true; $("#mapside").classList.add("open"); setTimeout(fitMapSize,50); }
    const n=$("#mapnote"); n.hidden=false; n.textContent="가게 위치를 지도에서 눌러 주세요";
    pickMode=true; pickCb=(lat,lng)=>{ ADD.lat=lat; ADD.lng=lng; n.hidden=true; if(window.innerWidth<980){ S.mapOpen=false; $("#mapside").classList.remove("open"); } renderAdd(); toast("위치를 찍었어요"); }; return; }
  if(c("[data-login]")){ if(window.__login) window.__login(); return; }
  if(c("[data-logout]")){ if(window.__logout) window.__logout(); return; }
  if(t.id!=="a-name" && !c("#sugg")){ const s=$("#sugg"); if(s) s.hidden=true; }
});
document.addEventListener("input", e=>{
  if(e.target.id==="q"){ clearTimeout(S.qt); S.qt=setTimeout(()=>{ S.q=e.target.value; render(); },150); }
  if(e.target.id==="a-name"){ if(ADD&&ADD.src){ ADD.src=null; ADD.lat=null; ADD.lng=null; ADD.tel=""; ADD.addr=""; const loc=$("#locNote"); if(loc) loc.textContent=""; const ad=$("#a-addr"); if(ad) ad.value=""; }
    if(ADD&&ADD.scope==="ydp") suggest(e.target.value); checkDup(); }
});
document.addEventListener("change", e=>{
  if(e.target.id==="sort"){ S.sort=e.target.value; render(); }
  if(e.target.id==="dongSel"){ S.dong=e.target.value; render(); }
  if(e.target.id==="a-dong" && ADD && ADD.sido==="seoul" && e.target.value==="영등포구"){ keepAddInputs(); ADD.scope="ydp"; ADD.src=null; renderAdd(); toast("영등포구는 동까지 골라 주세요"); }
  if(e.target.id==="a-sido"){ keepAddInputs(); ADD.dong=SIDO.find(s=>s.id===ADD.sido).dongs[0]; renderAdd(); }
});
document.addEventListener("keydown", e=>{
  if(e.key==="Escape"&&!$("#scrim").hidden){ ADD=null; closeSheet(); }
  if((e.key==="Enter"||e.key===" ")&&e.target.matches?.(".pin[data-p]")){ e.preventDefault(); openPlace(e.target.dataset.p); }
});
document.addEventListener("submit", async e=>{
  e.preventDefault(); const id=e.target.id;
  if(id==="infoForm"){
    const o=readInfo(); if(o.error){ toast(o.error); return; }
    const pid=S.sel; const rec={at:Date.now()}; for(const k of INFO_FIELDS) rec[k]= o[k]==null ? "" : o[k];
    if(await mutate(d=>{ d.info[pid]=rec; },"정보를 고쳤어요. 고마워요!")) renderPlace();
  }
  if(id==="stampForm"){
    const name=$("#s-name").value.trim().slice(0,4); if(!name){ $("#s-name").focus(); return; }
    const note=$("#s-note").value.trim().slice(0,120); const pid=S.sel; const first=!myDoc().stamps[pid];
    if(await mutate(d=>{ d.name=name; d.stamps[pid]={note,at:(d.stamps[pid]&&d.stamps[pid].at)||Date.now()}; }, first?"쾅! 보증 도장을 찍었어요":"한줄평을 고쳤어요")) renderPlace(first);
  }
  if(id==="addForm"){
    keepAddInputs(); const a=ADD;
    const name=a.name.trim().slice(0,40); if(!name){ $("#a-name").focus(); return; }
    const sname=$("#a-sname").value.trim().slice(0,4); if(!sname){ $("#a-sname").focus(); return; }
    const note=$("#a-note").value.trim().slice(0,120);
    const o=readInfo(); if(o.error){ toast(o.error); return; }
    if(!a.lat && a.addr.trim() && NMAP){ const r=await geocode((a.scope==="ydp"?"서울 영등포구 ":"")+a.addr); if(r){ a.lat=r.lat; a.lng=r.lng; } }
    const pid=newId(), now=Date.now();
    const place={name, cat:a.cat, scope:a.scope, addr:a.addr.trim().slice(0,80), at:now};
    if(a.scope==="ydp") place.area=a.area; else { place.sido=a.sido; place.dong=a.dong; }
    if(a.lat&&a.lng){ place.lat=+(+a.lat).toFixed(6); place.lng=+(+a.lng).toFixed(6); }
    const info={at:now}; for(const k of INFO_FIELDS) if(o[k]!=null) info[k]=o[k];
    if(!info.tel && a.tel) info.tel=fmtTel(a.tel);
    const ok=await mutate(d=>{ d.name=sname; d.places[pid]=place; d.stamps[pid]={note,at:now}; if(Object.keys(info).length>1) d.info[pid]=info; }, "쾅! 맛집이 추가됐어요");
    if(ok){ ADD=null; if(a.scope==="ydp"){ S.scope="ydp"; S.area=a.area; } else { S.scope="region"; S.sido=a.sido; S.dong=a.dong; } savePrefs(); S.sel=pid; nFit=""; render(); renderPlace(true); }
  }
});

/* ───── 시작 ───── */
let BACKEND_DB=null;
function setWho(){
  const w=$("#who");
  if(MODE==="firebase") w.innerHTML=`${esc(myName()||"로그인됨")} <button class="linkbtn" data-logout>로그아웃</button>`;
  else if(MODE==="none"&&BACKEND==="firebase") w.innerHTML=`<button class="linkbtn" data-login>로그인</button>`;
  else w.textContent = myName()?`${myName()} 님`:"";
}
try{ const m=JSON.parse(localStorage.getItem("minsul.mine")||"null"); if(m) DOCS[ME]={...emptyDoc(),...m}; }catch(e){}
rebuild(); render(); setWho();

loadNaver().then(()=>{
  $("#map").innerHTML=""; $("#mapnote").hidden=true;
  const t=mapTarget();
  NMAP=new naver.maps.Map("map",{center:new naver.maps.LatLng(t.c[0],t.c[1]),zoom:t.z,zoomControl:true,zoomControlOptions:{position:naver.maps.Position.RIGHT_CENTER}});
  fitMapSize(); setTimeout(fitMapSize,300);
  naver.maps.Event.addListener(NMAP,"click",ev=>{ if(pickMode&&pickCb){ pickMode=false; const f=pickCb; pickCb=null; f(ev.coord.y,ev.coord.x); } });
  nKey=""; nFit=""; render();
}).catch(()=>{});

function useSnapshot(docs){
  DOCS=docs; if(!DOCS[ME]) DOCS[ME]=emptyDoc(); rebuild(); render(); setWho();
  if(!$("#scrim").hidden && S.view==="place") renderPlace();
}
(async function start(){
  /* 1) 직접 올린 사이트: Firebase */
  if(window.firebase && FIREBASE_CONFIG.apiKey){
    BACKEND="firebase"; firebase.initializeApp(FIREBASE_CONFIG);
    const auth=firebase.auth(), fs=firebase.firestore(); BACKEND_DB=fs;
    window.__login=async()=>{ const pr=new firebase.auth.GoogleAuthProvider(); try{ await auth.signInWithPopup(pr); }catch(err){ if(err&&err.code==="auth/popup-blocked") auth.signInWithRedirect(pr); else if(err&&err.code!=="auth/popup-closed-by-user") toast("로그인하지 못했어요. 다시 눌러 주세요."); } };
    window.__logout=()=>auth.signOut();
    MODE="none"; DOCS={}; rebuild(); render(); setWho();
    let unsub=null;
    auth.onAuthStateChanged(u=>{
      if(unsub){ unsub(); unsub=null; }
      if(!u){ MODE="none"; ME="nobody"; DOCS={}; rebuild(); render(); setWho(); return; }
      MODE="firebase"; ME=u.uid; CAN_WRITE=true; DEFAULT_NAME=(u.displayName||"").replace(/\s/g,"").slice(0,4);
      unsub=fs.collection(COLL).onSnapshot(snap=>{ const next={}; snap.forEach(d=>{ next[d.id]={...emptyDoc(),...d.data()}; }); useSnapshot(next); },
        err=>{ if(err&&err.code==="permission-denied"){ toast("이 계정은 아직 민술랭 권한이 없어요. 관리자에게 등록을 요청해 주세요."); CAN_WRITE=false; } else toast("맛집 목록을 불러오지 못했어요. 새로고침해 주세요."); });
    });
    return;
  }
  /* 2) Claude 아티팩트 */
  if(window.claude && typeof window.claude.use==="function"){
    const db=await window.claude.use("db"); const user=await window.claude.use("user");
    if(!db){ if(user){ MODE="none"; DOCS={}; rebuild(); render(); } return; }
    BACKEND="claude"; BACKEND_DB=db; MODE="claude";
    try{ ME = user ? await user.id() : null; }catch(e){ ME=null; }
    if(!ME){ MODE="none"; ME="nobody"; }
    try{ if(user){ const me=await user.me(); DEFAULT_NAME=String((me&&me.name)||"").replace(/\s/g,"").slice(0,4); } }catch(e){}
    try{ const w=user?await user.can("data.write"):null; if(w===false) CAN_WRITE=false; }catch(e){}
    DOCS={}; rebuild(); render(); setWho();
    db.collection(COLL).onSnapshot(snap=>{ const next={}; for(const d of (snap.docs||[])){ const v=d.data(); if(v) next[d.id]={...emptyDoc(),...v}; } useSnapshot(next); },
      ()=>toast("맛집 목록을 불러오지 못했어요. 새로고침해 주세요."));
  }
})();
</script>
